name: check

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install bwrap, socat, and AppArmor tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat apparmor-utils
          bwrap --version
          socat -V | head -n 1

      - name: Install the AppArmor bwrap-attachment management script
        if: runner.os == 'Linux'
        run: sudo ./scripts/install-apparmor-bwrap-override.sh "$(whoami)"

      - name: ./gradlew check
        run: ./gradlew check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-report-${{ matrix.os }}
          path: |
            warden-api/build/reports/
            warden-core/build/reports/
          if-no-files-found: warn
          retention-days: 14
